[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphs-brookeandrie"
version = "1.0.0"
description = "Graph algorithms featuring Dijkstra's shortest-path algorithm"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Brooke Andrie"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]
